name: 自动构建部署到GitHub Pages
on:
  push:
    branches: [ "main", "test" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './在线学习系统-v2/package-lock.json'

      - name: 安装依赖
        run: cd 在线学习系统-v2 && npm install

      - name: 根据分支动态设置Vite base路径
        run: |
          cd 在线学习系统-v2
          if [ "${{ github.ref_name }}" == "test" ]; then
            echo "export default defineConfig({ base: '/OpenClawwww/test/', plugins: [vue()], server: { port: 5173 } })" > vite.config.js
          else
            echo "export default defineConfig({ base: '/OpenClawwww/', plugins: [vue()], server: { port: 5173 } })" > vite.config.js
          fi

      - name: 构建生产版本
        run: cd 在线学习系统-v2 && npm run build

      - name: 配置Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './在线学习系统-v2/dist'

      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
