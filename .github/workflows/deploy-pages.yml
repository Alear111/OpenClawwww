name: 自动构建部署到GitHub Pages
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # 全局指定工作目录，所有步骤都默认在这个目录下执行
    defaults:
      run:
        working-directory: ./在线学习系统-v2
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 完全删掉缓存配置，不需要锁文件

      - name: 安装依赖
        run: npm install

      - name: 构建生产版本
        run: npm run build

      - name: 配置Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 完整指定dist路径
          path: './在线学习系统-v2/dist'

      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
