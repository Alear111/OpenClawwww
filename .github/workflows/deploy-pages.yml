name: 多分支自动部署到GitHub Pages
on:
  push:
    branches: [ "main", "test" ]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: cd 在线学习系统-v2 && npm install

      - name: 根据分支设置base路径并构建
        run: |
          cd 在线学习系统-v2
          if [ "${{ github.ref_name }}" == "test" ]; then
            echo "export default defineConfig({ base: '/OpenClawwww/test/', plugins: [vue()], server: { port: 5173 } })" > vite.config.js
            npm run build
            mkdir -p ../dist/test
            mv dist/* ../dist/test/
          else
            echo "export default defineConfig({ base: '/OpenClawwww/', plugins: [vue()], server: { port: 5173 } })" > vite.config.js
            npm run build
            mkdir -p ../dist
            mv dist/* ../dist/
          fi

      - name: 部署到gh-pages分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
